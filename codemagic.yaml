workflows:
  ios-testflight:
    name: iOS TestFlight Beta
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.workouttracker.log
      flutter: 3.35.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing
        script: |
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning

          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          echo "Profile path: $PROFILE_PATH"

          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found!"
            exit 1
          fi

          security cms -D -i "$PROFILE_PATH" > /tmp/profile_decoded.plist 2>/dev/null

          PROFILE_UUID=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          print(d['UUID'])
          ")

          PROFILE_NAME=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          print(d['Name'])
          ")

          # プロファイルのチームID（DEVELOPMENT_TEAMと一致させる）
          PROFILE_TEAM_ID=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          teams = d.get('TeamIdentifier', [])
          print(teams[0] if teams else '')
          ")

          CERT_SHA1=$(security find-identity -v -p codesigning | \
            grep "Apple Distribution" | head -1 | awk '{print $2}')

          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: Could not extract UUID!"
            exit 1
          fi

          echo "UUID:           $PROFILE_UUID"
          echo "Name:           $PROFILE_NAME"
          echo "Profile TeamID: $PROFILE_TEAM_ID"
          echo "Cert SHA1:      $CERT_SHA1"

          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> $CM_ENV
          echo "CERT_SHA1=$CERT_SHA1" >> $CM_ENV

          # pbxprojをプロファイルの実際のチームIDとUUIDで更新
          python3 << 'PYEOF'
          import re, os

          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()

          uuid = os.environ['PROFILE_UUID']
          team_id = os.environ['PROFILE_TEAM_ID']

          # PROVISIONING_PROFILE_SPECIFIER をUUIDで置換
          content = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;',
              f'PROVISIONING_PROFILE_SPECIFIER = "{uuid}";',
              content
          )
          # DEVELOPMENT_TEAM をプロファイルのチームIDで置換
          content = re.sub(
              r'DEVELOPMENT_TEAM = [^;]*;',
              f'DEVELOPMENT_TEAM = {team_id};',
              content
          )

          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)

          print(f'pbxproj updated: TeamID={team_id}, UUID={uuid}')
          PYEOF

          echo "=== Verify pbxproj ==="
          grep -E "PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM" \
            ios/Runner.xcodeproj/project.pbxproj | head -10

      - name: Build Flutter
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=flutter.inspector.structuredErrors=false

      - name: Archive with xcodebuild
        script: |
          set -o pipefail
          echo "=== Profile UUID:   $PROFILE_UUID ==="
          echo "=== Profile TeamID: $PROFILE_TEAM_ID ==="
          echo "=== Cert SHA1:      $CERT_SHA1 ==="

          mkdir -p build/ios/archive

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$PROFILE_TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="$CERT_SHA1" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            archive \
            2>&1 | tee /tmp/xcodebuild_archive.log

          echo "=== Archive result ==="
          if [ -d "$PWD/build/ios/archive/Runner.xcarchive" ]; then
            echo "SUCCESS: Archive created"
            ls -la "$PWD/build/ios/archive/"
          else
            echo "FAILED: Archive not found"
            tail -100 /tmp/xcodebuild_archive.log
            exit 1
          fi

      - name: Export IPA
        script: |
          set -o pipefail
          echo "=== Exporting: UUID=$PROFILE_UUID, TeamID=$PROFILE_TEAM_ID ==="

          if [ ! -d "$PWD/build/ios/archive/Runner.xcarchive" ]; then
            echo "ERROR: Archive not found!"
            exit 1
          fi

          python3 -c "
          import plistlib, os
          with open('ios/ExportOptions.plist', 'rb') as f:
              d = plistlib.load(f)
          profile_uuid = os.environ.get('PROFILE_UUID', '')
          cert_sha1 = os.environ.get('CERT_SHA1', '')
          team_id = os.environ.get('PROFILE_TEAM_ID', '')
          print('UUID:', profile_uuid)
          print('SHA1:', cert_sha1)
          print('TeamID:', team_id)
          if profile_uuid:
              d['provisioningProfiles']['com.workouttracker.log'] = profile_uuid
          if cert_sha1:
              d['signingCertificate'] = cert_sha1
          if team_id:
              d['teamID'] = team_id
          with open('/tmp/ExportOptions.plist', 'wb') as f:
              plistlib.dump(d, f)
          print('provisioningProfiles:', d.get('provisioningProfiles'))
          "

          echo "=== ExportOptions.plist ==="
          cat /tmp/ExportOptions.plist

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa" \
            2>&1 | tee /tmp/xcodebuild_export.log

          echo "=== IPA result ==="
          if find "$PWD/build/ios/ipa" -name "*.ipa" | grep -q ".ipa"; then
            echo "SUCCESS: IPA created!"
            find "$PWD/build/ios/ipa" -name "*.ipa"
          else
            echo "FAILED: No IPA found"
            tail -80 /tmp/xcodebuild_export.log
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_export.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.workouttracker.log
      flutter: 3.35.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing
        script: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          security cms -D -i "$PROFILE_PATH" > /tmp/profile_decoded.plist 2>/dev/null
          PROFILE_UUID=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          print(d['UUID'])
          ")
          PROFILE_TEAM_ID=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          teams = d.get('TeamIdentifier', [])
          print(teams[0] if teams else '')
          ")
          CERT_SHA1=$(security find-identity -v -p codesigning | \
            grep "Apple Distribution" | head -1 | awk '{print $2}')
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> $CM_ENV
          echo "CERT_SHA1=$CERT_SHA1" >> $CM_ENV

          python3 << 'PYEOF'
          import re, os
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          uuid = os.environ['PROFILE_UUID']
          team_id = os.environ['PROFILE_TEAM_ID']
          content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;',
              f'PROVISIONING_PROFILE_SPECIFIER = "{uuid}";', content)
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;',
              f'DEVELOPMENT_TEAM = {team_id};', content)
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          print(f'pbxproj updated: TeamID={team_id}, UUID={uuid}')
          PYEOF

      - name: Build Flutter
        script: |
          flutter build ios --release --no-codesign

      - name: Archive with xcodebuild
        script: |
          set -o pipefail
          mkdir -p build/ios/archive
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$PROFILE_TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="$CERT_SHA1" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            archive \
            2>&1 | tee /tmp/xcodebuild_archive.log

          if [ ! -d "$PWD/build/ios/archive/Runner.xcarchive" ]; then
            echo "FAILED: Archive not created"
            tail -80 /tmp/xcodebuild_archive.log
            exit 1
          fi

      - name: Export IPA
        script: |
          set -o pipefail
          python3 -c "
          import plistlib, os
          with open('ios/ExportOptions.plist', 'rb') as f:
              d = plistlib.load(f)
          profile_uuid = os.environ.get('PROFILE_UUID', '')
          cert_sha1 = os.environ.get('CERT_SHA1', '')
          team_id = os.environ.get('PROFILE_TEAM_ID', '')
          if profile_uuid:
              d['provisioningProfiles']['com.workouttracker.log'] = profile_uuid
          if cert_sha1:
              d['signingCertificate'] = cert_sha1
          if team_id:
              d['teamID'] = team_id
          with open('/tmp/ExportOptions.plist', 'wb') as f:
              plistlib.dump(d, f)
          "
          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa" \
            2>&1 | tee /tmp/xcodebuild_export.log

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_export.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
