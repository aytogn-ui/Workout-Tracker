workflows:
  ios-testflight:
    name: iOS TestFlight Beta
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.workouttracker.log
      flutter: 3.35.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Install certificates to keychain
        script: |
          # Codemagicが設定した証明書・プロファイルを確認
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning

          echo "=== Provisioning profiles ==="
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          echo "Profile: $PROFILE_PATH"

          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found!"
            exit 1
          fi

          # プロファイルのUUIDと名前を取得
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | \
            python3 -c "import sys, plistlib; d=plistlib.load(sys.stdin.buffer); print(d['UUID'])")
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | \
            python3 -c "import sys, plistlib; d=plistlib.load(sys.stdin.buffer); print(d['Name'])")

          echo "UUID: $PROFILE_UUID"
          echo "Name: $PROFILE_NAME"

          # 環境変数として保存
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV

      - name: Build Flutter
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=flutter.inspector.structuredErrors=false

      - name: Archive with xcodebuild
        script: |
          echo "Using profile UUID: $PROFILE_UUID"

          mkdir -p build/ios/archive

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="Q7XPYDQ69X" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive | xcpretty

          echo "=== Archive result ==="
          ls -la "$PWD/build/ios/archive/" || echo "Archive not found"

      - name: Export IPA
        script: |
          echo "Exporting with UUID: $PROFILE_UUID"

          # python3 plistlib でExportOptions.plistのUUIDを動的に更新
          python3 -c "
          import plistlib, os
          plist_path = 'ios/ExportOptions.plist'
          with open(plist_path, 'rb') as f:
              d = plistlib.load(f)
          profile_uuid = os.environ.get('PROFILE_UUID', '')
          if profile_uuid:
              d['provisioningProfiles']['com.workouttracker.log'] = profile_uuid
          dest = '/tmp/ExportOptions.plist'
          with open(dest, 'wb') as f:
              plistlib.dump(d, f)
          print('ExportOptions.plist written to:', dest)
          print('provisioningProfiles:', d.get('provisioningProfiles'))
          "

          cat /tmp/ExportOptions.plist

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa" \
            | xcpretty

          echo "=== IPA result ==="
          find "$PWD/build/ios/ipa" -name "*.ipa" || echo "No IPA found"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.workouttracker.log
      flutter: 3.35.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Install certificates to keychain
        script: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | \
            python3 -c "import sys, plistlib; d=plistlib.load(sys.stdin.buffer); print(d['UUID'])")
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | \
            python3 -c "import sys, plistlib; d=plistlib.load(sys.stdin.buffer); print(d['Name'])")
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV

      - name: Build Flutter
        script: |
          flutter build ios --release --no-codesign

      - name: Archive with xcodebuild
        script: |
          mkdir -p build/ios/archive
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="Q7XPYDQ69X" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive | xcpretty

      - name: Export IPA
        script: |
          # python3 plistlib でExportOptions.plistのUUIDを動的に更新
          python3 -c "
          import plistlib, os
          plist_path = 'ios/ExportOptions.plist'
          with open(plist_path, 'rb') as f:
              d = plistlib.load(f)
          profile_uuid = os.environ.get('PROFILE_UUID', '')
          if profile_uuid:
              d['provisioningProfiles']['com.workouttracker.log'] = profile_uuid
          dest = '/tmp/ExportOptions.plist'
          with open(dest, 'wb') as f:
              plistlib.dump(d, f)
          "

          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa" \
            | xcpretty

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
