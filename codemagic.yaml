workflows:
  ios-testflight:
    name: iOS TestFlight Beta
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.workouttracker.log
      flutter: 3.35.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e
          echo "=== Building IPA ==="
          flutter build ipa \
            --release \
            --export-method=app-store \
            --verbose 2>&1 | grep -E "(error:|warning:|Built|FAILED|SUCCEEDED|exportArchive|provisioning|signing)" || true
          
          echo "=== Checking output ==="
          find . -name "*.ipa" 2>/dev/null || echo "No IPA file found"
          ls -la build/ios/ipa/ 2>/dev/null || echo "build/ios/ipa/ does not exist"
          ls -la build/ios/archive/ 2>/dev/null || echo "build/ios/archive/ does not exist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
