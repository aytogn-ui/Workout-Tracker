workflows:
  ios-testflight:
    name: iOS TestFlight Beta
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.workouttracker.log
      flutter: 3.35.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing
        # xcode-project use-profiles がRunnerのpbxprojに署名設定を自動書き込みする
        script: xcode-project use-profiles

      - name: Verify signing setup
        script: |
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning

          echo "=== Provisioning profiles ==="
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          echo "Profile path: $PROFILE_PATH"

          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found!"
            exit 1
          fi

          # Python 3.12対応: パイプ不可のためファイル経由で解析
          security cms -D -i "$PROFILE_PATH" > /tmp/profile_decoded.plist 2>/dev/null

          PROFILE_UUID=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          print(d['UUID'])
          ")

          PROFILE_NAME=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          print(d['Name'])
          ")

          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: Could not extract UUID from profile!"
            exit 1
          fi

          echo "UUID: $PROFILE_UUID"
          echo "Name: $PROFILE_NAME"

          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV

          echo "=== Xcode signing settings (after use-profiles) ==="
          grep -E "CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM" \
            ios/Runner.xcodeproj/project.pbxproj | head -20 || true

      - name: Build Flutter
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=flutter.inspector.structuredErrors=false

      - name: Archive with xcodebuild
        script: |
          set -o pipefail
          echo "=== Profile UUID: $PROFILE_UUID ==="
          echo "=== Profile Name: $PROFILE_NAME ==="

          mkdir -p build/ios/archive

          # 【重要】CODE_SIGN_STYLEとPROVISIONING_PROFILE_SPECIFIERをxcodebuildに渡さない
          # → use-profilesがRunnerのpbxprojに書き込み済みのためここで上書きすると
          #    Podsターゲットにも伝播してエラーになる
          # PROVISIONING_PROFILE（UUID）のみRunnerターゲットに限定して指定する
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="Q7XPYDQ69X" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            "PROVISIONING_PROFILE[sdk=iphoneos*]=$PROFILE_UUID" \
            archive 2>&1 | tee /tmp/xcodebuild_archive.log

          echo "=== Archive result ==="
          if [ -d "$PWD/build/ios/archive/Runner.xcarchive" ]; then
            echo "SUCCESS: Archive created"
            ls -la "$PWD/build/ios/archive/"
          else
            echo "FAILED: Archive not found"
            tail -80 /tmp/xcodebuild_archive.log
            exit 1
          fi

      - name: Export IPA
        script: |
          set -o pipefail
          echo "=== Exporting IPA with UUID: $PROFILE_UUID ==="

          if [ ! -d "$PWD/build/ios/archive/Runner.xcarchive" ]; then
            echo "ERROR: Archive not found before export!"
            exit 1
          fi

          # python3 plistlib でExportOptions.plistのUUIDを動的に更新
          python3 -c "
          import plistlib, os
          plist_path = 'ios/ExportOptions.plist'
          with open(plist_path, 'rb') as f:
              d = plistlib.load(f)
          profile_uuid = os.environ.get('PROFILE_UUID', '')
          print('PROFILE_UUID from env:', profile_uuid)
          if profile_uuid:
              d['provisioningProfiles']['com.workouttracker.log'] = profile_uuid
          dest = '/tmp/ExportOptions.plist'
          with open(dest, 'wb') as f:
              plistlib.dump(d, f)
          print('Written to:', dest)
          print('provisioningProfiles:', d.get('provisioningProfiles'))
          "

          echo "=== ExportOptions.plist content ==="
          cat /tmp/ExportOptions.plist

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa" \
            2>&1 | tee /tmp/xcodebuild_export.log

          echo "=== IPA result ==="
          if find "$PWD/build/ios/ipa" -name "*.ipa" | grep -q ".ipa"; then
            echo "SUCCESS: IPA created!"
            find "$PWD/build/ios/ipa" -name "*.ipa"
          else
            echo "FAILED: No IPA found"
            tail -80 /tmp/xcodebuild_export.log
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_export.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.workouttracker.log
      flutter: 3.35.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Verify signing setup
        script: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          security cms -D -i "$PROFILE_PATH" > /tmp/profile_decoded.plist 2>/dev/null
          PROFILE_UUID=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          print(d['UUID'])
          ")
          PROFILE_NAME=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          print(d['Name'])
          ")
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV

      - name: Build Flutter
        script: |
          flutter build ios --release --no-codesign

      - name: Archive with xcodebuild
        script: |
          set -o pipefail
          mkdir -p build/ios/archive
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="Q7XPYDQ69X" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            "PROVISIONING_PROFILE[sdk=iphoneos*]=$PROFILE_UUID" \
            archive 2>&1 | tee /tmp/xcodebuild_archive.log

          if [ ! -d "$PWD/build/ios/archive/Runner.xcarchive" ]; then
            echo "FAILED: Archive not created"
            tail -80 /tmp/xcodebuild_archive.log
            exit 1
          fi

      - name: Export IPA
        script: |
          set -o pipefail
          python3 -c "
          import plistlib, os
          plist_path = 'ios/ExportOptions.plist'
          with open(plist_path, 'rb') as f:
              d = plistlib.load(f)
          profile_uuid = os.environ.get('PROFILE_UUID', '')
          if profile_uuid:
              d['provisioningProfiles']['com.workouttracker.log'] = profile_uuid
          dest = '/tmp/ExportOptions.plist'
          with open(dest, 'wb') as f:
              plistlib.dump(d, f)
          "

          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa" \
            2>&1 | tee /tmp/xcodebuild_export.log

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_export.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
