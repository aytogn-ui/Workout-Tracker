workflows:
  ios-testflight:
    name: iOS TestFlight Beta
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.workouttracker.log
      flutter: 3.35.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing
        script: |
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning

          # プロビジョニングプロファイルを取得
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          echo "Profile path: $PROFILE_PATH"

          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found!"
            exit 1
          fi

          # Python 3.12対応: ファイル経由でplistを解析
          security cms -D -i "$PROFILE_PATH" > /tmp/profile_decoded.plist 2>/dev/null

          PROFILE_UUID=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          print(d['UUID'])
          ")

          PROFILE_NAME=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          print(d['Name'])
          ")

          # 証明書のSHA-1フィンガープリントを取得
          CERT_SHA1=$(security find-identity -v -p codesigning | \
            grep "Apple Distribution" | head -1 | awk '{print $2}')

          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: Could not extract UUID!"
            exit 1
          fi

          echo "UUID:  $PROFILE_UUID"
          echo "Name:  $PROFILE_NAME"
          echo "SHA1:  $CERT_SHA1"

          # 環境変数を保存
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV
          echo "CERT_SHA1=$CERT_SHA1" >> $CM_ENV

          # pbxprojのPROVISIONING_PROFILE_SPECIFIERをUUIDで上書き
          # use-profilesを使わず直接書き換えることで名前検索エラーを回避
          python3 -c "
          import re, sys

          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()

          uuid = '$PROFILE_UUID'

          # PROVISIONING_PROFILE_SPECIFIER を UUID で置換
          content = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;',
              f'PROVISIONING_PROFILE_SPECIFIER = \"{uuid}\";',
              content
          )

          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)

          print('pbxproj updated with UUID:', uuid)
          "

          echo "=== Verify pbxproj ==="
          grep -E "PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM" \
            ios/Runner.xcodeproj/project.pbxproj | head -10

      - name: Build Flutter
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=flutter.inspector.structuredErrors=false

      - name: Archive with xcodebuild
        script: |
          set -o pipefail
          echo "=== Profile UUID: $PROFILE_UUID ==="
          echo "=== Cert SHA1:    $CERT_SHA1 ==="

          mkdir -p build/ios/archive

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="Q7XPYDQ69X" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="$CERT_SHA1" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            archive \
            2>&1 | tee /tmp/xcodebuild_archive.log

          echo "=== Archive result ==="
          if [ -d "$PWD/build/ios/archive/Runner.xcarchive" ]; then
            echo "SUCCESS: Archive created"
            ls -la "$PWD/build/ios/archive/"
          else
            echo "FAILED: Archive not found"
            tail -100 /tmp/xcodebuild_archive.log
            exit 1
          fi

      - name: Export IPA
        script: |
          set -o pipefail
          echo "=== Exporting with UUID: $PROFILE_UUID, SHA1: $CERT_SHA1 ==="

          if [ ! -d "$PWD/build/ios/archive/Runner.xcarchive" ]; then
            echo "ERROR: Archive not found!"
            exit 1
          fi

          python3 -c "
          import plistlib, os
          with open('ios/ExportOptions.plist', 'rb') as f:
              d = plistlib.load(f)
          profile_uuid = os.environ.get('PROFILE_UUID', '')
          cert_sha1 = os.environ.get('CERT_SHA1', '')
          print('UUID:', profile_uuid)
          print('SHA1:', cert_sha1)
          if profile_uuid:
              d['provisioningProfiles']['com.workouttracker.log'] = profile_uuid
          if cert_sha1:
              d['signingCertificate'] = cert_sha1
          with open('/tmp/ExportOptions.plist', 'wb') as f:
              plistlib.dump(d, f)
          print('provisioningProfiles:', d.get('provisioningProfiles'))
          print('signingCertificate:', d.get('signingCertificate'))
          "

          echo "=== ExportOptions.plist ==="
          cat /tmp/ExportOptions.plist

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa" \
            2>&1 | tee /tmp/xcodebuild_export.log

          echo "=== IPA result ==="
          if find "$PWD/build/ios/ipa" -name "*.ipa" | grep -q ".ipa"; then
            echo "SUCCESS: IPA created!"
            find "$PWD/build/ios/ipa" -name "*.ipa"
          else
            echo "FAILED: No IPA found"
            tail -80 /tmp/xcodebuild_export.log
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_export.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.workouttracker.log
      flutter: 3.35.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing
        script: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          security cms -D -i "$PROFILE_PATH" > /tmp/profile_decoded.plist 2>/dev/null
          PROFILE_UUID=$(python3 -c "
          import plistlib
          with open('/tmp/profile_decoded.plist', 'rb') as f:
              d = plistlib.load(f)
          print(d['UUID'])
          ")
          CERT_SHA1=$(security find-identity -v -p codesigning | \
            grep "Apple Distribution" | head -1 | awk '{print $2}')
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "CERT_SHA1=$CERT_SHA1" >> $CM_ENV

          python3 -c "
          import re
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          uuid = '$PROFILE_UUID'
          content = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;',
              f'PROVISIONING_PROFILE_SPECIFIER = \"{uuid}\";',
              content
          )
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          print('pbxproj updated:', uuid)
          "

      - name: Build Flutter
        script: |
          flutter build ios --release --no-codesign

      - name: Archive with xcodebuild
        script: |
          set -o pipefail
          mkdir -p build/ios/archive
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="Q7XPYDQ69X" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="$CERT_SHA1" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            archive \
            2>&1 | tee /tmp/xcodebuild_archive.log

          if [ ! -d "$PWD/build/ios/archive/Runner.xcarchive" ]; then
            echo "FAILED: Archive not created"
            tail -80 /tmp/xcodebuild_archive.log
            exit 1
          fi

      - name: Export IPA
        script: |
          set -o pipefail
          python3 -c "
          import plistlib, os
          with open('ios/ExportOptions.plist', 'rb') as f:
              d = plistlib.load(f)
          profile_uuid = os.environ.get('PROFILE_UUID', '')
          cert_sha1 = os.environ.get('CERT_SHA1', '')
          if profile_uuid:
              d['provisioningProfiles']['com.workouttracker.log'] = profile_uuid
          if cert_sha1:
              d['signingCertificate'] = cert_sha1
          with open('/tmp/ExportOptions.plist', 'wb') as f:
              plistlib.dump(d, f)
          "
          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa" \
            2>&1 | tee /tmp/xcodebuild_export.log

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_export.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
